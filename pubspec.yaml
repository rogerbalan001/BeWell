name: bewell
description: Bewell e-Health — aplicación Flutter (Android, iOS y Web). MVP Sprint 1.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Presentación: gestión de estado BLoC/Cubit
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # Core: inyección de dependencias, HTTP, almacenamiento seguro y navegación
  get_it: ^7.7.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  # Utilidades de UI
  intl: ^0.19.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
