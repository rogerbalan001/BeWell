name: APK Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/apk.yml'
      - '.github/scripts/build-apk.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compilar el APK
        run: bash .github/scripts/build-apk.sh
        env:
          # URL pública de la API (variable del repositorio API_URL; por defecto, Render).
          API_URL: ${{ vars.API_URL || 'https://bewell-api.onrender.com/api/v1' }}
      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bewell-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar el APK en la rama apk-dist
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apk && cp app/build/app/outputs/flutter-apk/app-release.apk /tmp/apk/Bewell.apk
          cd /tmp/apk
          echo "$GITHUB_SHA" > version.txt
          git init -q -b apk-dist
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "APK compilado desde $GITHUB_SHA"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
